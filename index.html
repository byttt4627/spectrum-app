<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>音频频谱图工具</title>
<style>
  /* ── Win7 Aero 全局重置 ─────────────────────────── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Microsoft YaHei", "Segoe UI", Tahoma, sans-serif;
    background: #3b5a8a;  /* Win7 经典蓝 */
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 30px;
    /* 顶部 Aero 玻璃效果渐变 */
    background: linear-gradient(180deg, #4a7ec9 0%, #2c5f9a 40%, #1a3d6e 100%);
    /* 经典 Win7 桌面风格 */
    user-select: none;
  }

  h1 {
    font-size: 22px;
    font-weight: normal;
    margin-bottom: 2px;
    color: #ffffff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 12px;
    color: #c8daf0;
    margin-bottom: 16px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }

  /* ── 主窗口卡片 ───────────────────────────── */
  .main-panel {
    background: #f0f0f0;
    border: 1px solid #b0b0b0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 960px;
    overflow: hidden;
  }

  /* Win7 窗口标题栏 */
  .win-titlebar {
    background: linear-gradient(180deg, #e8e8e8 0%, #d4d4d4 100%);
    height: 30px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #b0b0b0;
  }
  .win-titlebar .icon {
    width: 16px; height: 16px;
    background: #4a7ec9;
    margin-right: 8px;
  }
  .win-titlebar .title {
    font-size: 12px;
    color: #333;
    flex: 1;
  }
  .win-titlebar .win-btns {
    display: flex; gap: 4px;
  }
  .win-titlebar .win-btns span {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px;
    text-align: center;
    font-size: 12px;
    color: #555;
    border: 1px solid transparent;
  }
  .win-titlebar .win-btns span:hover {
    background: #e0e0e0;
    border-color: #b0b0b0;
  }
  .win-titlebar .win-btns .close:hover {
    background: #e81123;
    color: white;
    border-color: #a01020;
  }

  /* ── 工具栏（菜单条 Win7 风格） ────────── */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    width: 100%; max-width: 960px;
    margin-bottom: 12px;
  }

  /* ── 拖拽区域 Win7 面板风格 ────────────── */
  .drop-zone {
    flex: 1;
    border: 2px dashed #7a9ec9;
    padding: 18px 24px;
    text-align: center;
    background: linear-gradient(180deg, #eaf0f8 0%, #dce6f2 100%);
    cursor: pointer;
    transition: background 0.15s;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
  }
  .drop-zone:hover, .drop-zone.drag-over {
    background: linear-gradient(180deg, #f0f6ff 0%, #e0eaf8 100%);
    border-color: #4a7ec9;
  }
  .drop-zone input { display: none; }
  .drop-icon { font-size: 28px; margin-bottom: 4px; color: #4a7ec9; }
  .drop-text { font-size: 13px; color: #444; }
  .drop-hint { font-size: 11px; color: #888; margin-top: 4px; }

  /* ── 参数面板 ─────────────────────────────── */
  .controls {
    display: flex; gap: 12px; flex-wrap: wrap;
    align-items: flex-start; justify-content: flex-start;
    width: 100%; max-width: 960px;
    background: linear-gradient(180deg, #f5f5f5 0%, #e8e8e8 100%);
    border: 1px solid #c0c0c0;
    border-top: none;
    padding: 10px 14px;
  }
  .control-group { display: flex; flex-direction: column; gap: 3px; }
  .control-group label {
    font-size: 11px; color: #555;
  }
  select, input[type=range] {
    background: #fff;
    border: 1px solid #b0b0b0;
    color: #333;
    padding: 3px 6px;
    font-size: 12px;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  select:focus { border-color: #4a7ec9; outline: 1px solid #4a7ec9; }
  .range-row { display: flex; align-items: center; gap: 6px; }
  .range-val { font-size: 11px; color: #4a7ec9; width: 32px; }

  .divider {
    width: 1px; background: #c0c0c0; align-self: stretch; margin: 0 4px;
  }

  /* ── Win7 风格按钮 ─────────────────────── */
  .btn {
    padding: 5px 16px;
    border: 1px solid #b0b0b0;
    cursor: pointer;
    font-size: 12px;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #f8f8f8 0%, #e0e0e0 100%);
    color: #333;
    box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, #fcfcff 0%, #e8ecf8 100%);
    border-color: #7a9ec9;
  }
  .btn:active:not(:disabled) {
    background: linear-gradient(180deg, #d0d0d0 0%, #e0e0e0 100%);
    box-shadow: none;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary {
    background: linear-gradient(180deg, #4a7ec9 0%, #2c5f9a 100%);
    color: white;
    border-color: #2c5f9a;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(180deg, #5a8ed9 0%, #3c6faa 100%);
    border-color: #2c5f9a;
  }
  .btn-primary:active:not(:disabled) {
    background: linear-gradient(180deg, #2c5f9a 0%, #1a3d6e 100%);
  }
  .btn-success {
    background: linear-gradient(180deg, #5a9a5a 0%, #3d7a3d 100%);
    color: white;
    border-color: #3d7a3d;
    box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .btn-success:hover:not(:disabled) {
    background: linear-gradient(180deg, #6aaa6a 0%, #4d8a4d 100%);
  }
  .btn-success:active:not(:disabled) {
    background: linear-gradient(180deg, #3d7a3d 0%, #2d5a2d 100%);
  }
  .btn-sm { padding: 3px 10px; font-size: 11px; }

  #status {
    font-size: 12px;
    color: #666;
    min-height: 18px;
    margin-bottom: 8px;
    max-width: 960px;
    width: 100%;
    padding-left: 4px;
  }

  /* ── 频谱图容器 ─────────────────── */
  .viewer { width: 100%; max-width: 960px; display: none; flex-direction: column; gap: 0; }

  .canvas-wrap {
    background: #fff;
    border: 1px solid #c0c0c0;
    overflow: hidden; position: relative; cursor: crosshair;
  }
  #specCanvas { width: 100%; display: block; }

  /* ── 缩放工具栏 ─────────────────── */
  .zoom-bar {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, #f0f0f0 0%, #e0e0e0 100%);
    padding: 4px 10px;
    border: 1px solid #c0c0c0;
    border-top: none;
  }
  .zoom-level {
    font-size: 12px; color: #2c5f9a;
    min-width: 34px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .zoom-hint { font-size: 10px; color: #999; margin-left: auto; }
  .time-range { font-size: 11px; color: #666; }

  /* ── 滚动条 ─────────────────────── */
  .scrollbar-wrap {
    background: #e8e8e8;
    padding: 5px 6px;
    border: 1px solid #c0c0c0;
    border-top: none;
  }
  .scrollbar-track {
    position: relative; height: 10px;
    background: #c0c0c0;
    border: 1px solid #a0a0a0;
    cursor: pointer;
  }
  .scrollbar-thumb {
    position: absolute; top: 0; height: 100%;
    background: linear-gradient(180deg, #d0d0d0 0%, #b0b0b0 100%);
    border: 1px solid #909090;
    cursor: grab; min-width: 16px;
    transition: background 0.1s;
  }
  .scrollbar-thumb:hover, .scrollbar-thumb.dragging {
    background: linear-gradient(180deg, #e0e0e0 0%, #c0c0c0 100%);
  }

  /* ── 色标 & 播放器 ─────────────── */
  .colorbar-wrap {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px; width: 100%; max-width: 960px;
  }
  .colorbar-label { font-size: 11px; color: #888; }
  #colorbar { height: 14px; flex: 1; border: 1px solid #b0b0b0; }

  .audio-player { width: 100%; max-width: 960px; margin-top: 12px; display: none; }
  audio { width: 100%; }

  .info-bar {
    width: 100%; max-width: 960px;
    display: none; gap: 16px; flex-wrap: wrap;
    margin-top: 8px; font-size: 11px; color: #c8daf0;
    text-shadow: 0 1px 0 rgba(0,0,0,0.2);
  }
  .info-bar span { color: #ffffff; }

  /* 渲染中遮罩 */
  .rendering-mask {
    display: none; position: absolute; inset: 0;
    background: rgba(255,255,255,0.7);
    align-items: center; justify-content: center;
    font-size: 13px; color: #2c5f9a;
  }
  .rendering-mask.active { display: flex; }

  /* ── Win7 Aero 底部状态栏 ────────────── */
  .statusbar {
    width: 100%; max-width: 960px;
    background: linear-gradient(180deg, #d4d4d4 0%, #c0c0c0 100%);
    border: 1px solid #b0b0b0;
    border-top: none;
    padding: 3px 10px;
    font-size: 11px;
    color: #555;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }

</style>
</head>
<body>

<h1>音频频谱图工具</h1>
<p class="subtitle">支持 MP3 / WAV / OGG / FLAC / AAC 等格式</p>

<div class="main-panel">
  <!-- Win7 窗口标题栏 -->
  <div class="win-titlebar">
    <div class="icon"></div>
    <span class="title">音频频谱图工具</span>
    <div class="win-btns">
      <span>&#9472;</span>
      <span>&#9744;</span>
      <span class="close">&#10005;</span>
    </div>
  </div>

  <!-- 拖拽区 -->
  <div style="padding:12px 14px 0 14px;background:#f0f0f0;">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="audio/*">
      <div class="drop-icon">&#9835;</div>
      <div class="drop-text">拖拽音频文件到此处，或点击选择文件</div>
      <div class="drop-hint">支持 MP3 / WAV / OGG / FLAC / M4A / AAC</div>
    </div>
  </div>

  <!-- 参数面板 -->
  <div class="controls">
    <div class="control-group">
      <label>色彩方案</label>
      <select id="colormap">
        <option value="viridis">Viridis（蓝绿黄）</option>
        <option value="magma">Magma（黑紫橙）</option>
        <option value="inferno">Inferno（黑红黄）</option>
        <option value="plasma">Plasma（紫橙黄）</option>
        <option value="hot">Hot（黑红白）</option>
        <option value="cool">Cool（蓝绿）</option>
        <option value="ocean">Ocean（深海蓝）</option>
        <option value="grayscale">灰度</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>亮度 <span id="brightnessVal" style="color:#2c5f9a">1.0</span></label>
      <div class="range-row">
        <input type="range" id="brightness" min="0.3" max="3.0" value="1.0" step="0.1" style="width:100px">
      </div>
    </div>

    <div class="control-group">
      <label>Gamma <span id="gammaVal" style="color:#2c5f9a">1.0</span></label>
      <div class="range-row">
        <input type="range" id="gamma" min="0.3" max="3.0" value="1.0" step="0.1" style="width:100px">
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>FFT 窗口</label>
      <select id="fftSize">
        <option value="1024">1024（快速）</option>
        <option value="2048" selected>2048（均衡）</option>
        <option value="4096">4096（精细）</option>
        <option value="8192">8192（超精细）</option>
      </select>
    </div>

    <div class="control-group">
      <label>最大频率</label>
      <select id="maxFreq">
        <option value="8000">8000 Hz</option>
        <option value="12000">12000 Hz</option>
        <option value="16000">16000 Hz</option>
        <option value="22050" selected>全频（22050）</option>
      </select>
    </div>

    <div class="control-group">
      <label>纵轴刻度</label>
      <select id="freqScale">
        <option value="linear">线性</option>
        <option value="log" selected>对数</option>
      </select>
    </div>

    <div class="control-group">
      <label>动态范围 (dB)</label>
      <div class="range-row">
        <input type="range" id="dynRange" min="40" max="120" value="80" step="10">
        <span class="range-val" id="dynRangeVal">80</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group" style="justify-content:flex-end;padding-top:16px;">
      <div style="display:flex;gap:6px;">
        <button class="btn btn-success" id="saveBtn" disabled>保存当前视图</button>
      </div>
    </div>
  </div>

  <!-- 状态文本 -->
  <div id="status" style="padding:4px 14px 0 14px;background:#f0f0f0;"></div>

  <!-- 频谱图主体 -->
  <div style="padding:0 14px 0 14px;background:#f0f0f0;">
    <div class="viewer" id="viewer">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="specCanvas"></canvas>
        <div class="rendering-mask" id="renderingMask">重新渲染中…</div>
      </div>
      <div class="zoom-bar">
        <button class="btn btn-sm" id="zoomOut">－</button>
        <span class="zoom-level" id="zoomLabel">1×</span>
        <button class="btn btn-sm" id="zoomIn">＋</button>
        <button class="btn btn-sm" id="zoomReset">复位</button>
        <span class="time-range" id="timeRange"></span>
        <span class="zoom-hint">滚轮缩放 · 拖动平移</span>
      </div>
      <div class="scrollbar-wrap">
        <div class="scrollbar-track" id="scrollTrack">
          <div class="scrollbar-thumb" id="scrollThumb"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div class="statusbar">就绪</div>
</div>

<div class="colorbar-wrap" id="colorbarWrap" style="display:none">
  <span class="colorbar-label">弱</span>
  <canvas id="colorbar"></canvas>
  <span class="colorbar-label">强</span>
</div>

<div class="audio-player" id="audioPlayer">
  <audio id="audioEl" controls></audio>
</div>

<div class="info-bar" id="infoBar">
  <div>文件名：<span id="infoName">-</span></div>
  <div>时长：<span id="infoDuration">-</span></div>
  <div>采样率：<span id="infoSR">-</span></div>
  <div>声道：<span id="infoCh">-</span></div>
  <div>大小：<span id="infoSize">-</span></div>
</div>

<script>
// ── 颜色映射 ─────────────────────────────────────────────
const colormaps = {
  viridis: t => interp([[68,1,84],[72,40,120],[62,83,160],[49,120,188],[38,155,205],[53,183,201],[91,207,178],[140,225,150],[190,236,121],[242,240,97],[253,231,37]], t),
  magma:   t => interp([[0,0,4],[28,16,68],[79,18,123],[129,37,129],[181,54,122],[229,80,100],[251,135,97],[254,194,135],[252,253,191]], t),
  inferno: t => interp([[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[252,193,44],[252,255,164]], t),
  plasma:  t => interp([[13,8,135],[84,2,163],[139,10,165],[185,50,137],[219,92,104],[244,136,73],[254,188,43],[240,249,33]], t),
  hot: t => {
    if (t < 0.333) return [Math.round(t*3*255), 0, 0];
    if (t < 0.667) return [255, Math.round((t-0.333)*3*255), 0];
    return [255, 255, Math.round((t-0.667)*3*255)];
  },
  cool:      t => [Math.round(t*255), Math.round((1-t)*255), 255],
  ocean:     t => interp([[0,10,30],[0,30,80],[0,80,150],[0,130,180],[20,180,200],[100,220,220],[200,250,240]], t),
  grayscale: t => { const v = Math.round(t*255); return [v,v,v]; }
};
function interp(stops, t) {
  const n = stops.length - 1;
  const idx = Math.min(Math.floor(t * n), n - 1);
  const f = t * n - idx;
  const a = stops[idx], b = stops[idx+1];
  return [Math.round(a[0]+(b[0]-a[0])*f), Math.round(a[1]+(b[1]-a[1])*f), Math.round(a[2]+(b[2]-a[2])*f)];
}

function applyColorTransform(t, brightness, gamma) {
  let v = Math.pow(Math.max(0, Math.min(1, t)), gamma) * brightness;
  return Math.max(0, Math.min(1, v));
}

// ── 全局状态 ──────────────────────────────────────────────
let audioBuffer = null;
let fileName = '';

let specData     = null;
let specFrames   = 0;
let specBins     = 0;
let specMaxPow   = 0;
let specSr       = 0;
let specMaxFreq  = 0;
let specDuration = 0;
let specFftSize  = 0;

let viewZoom  = 1;
let viewStart = 0;

let recomputeTimer = null;
let renderOnlyTimer = null;

// ── DOM 引用 ──────────────────────────────────────────────
const dropZone    = document.getElementById('dropZone');
const fileInput   = document.getElementById('fileInput');
const saveBtn     = document.getElementById('saveBtn');
const statusEl    = document.getElementById('status');
const canvas      = document.getElementById('specCanvas');
const ctx         = canvas.getContext('2d');
const colorbarCv  = document.getElementById('colorbar');
const audioEl     = document.getElementById('audioEl');
const viewer      = document.getElementById('viewer');
const scrollThumb = document.getElementById('scrollThumb');
const scrollTrack = document.getElementById('scrollTrack');
const zoomLabel   = document.getElementById('zoomLabel');
const timeRange   = document.getElementById('timeRange');
const renderingMask = document.getElementById('renderingMask');
const statusBar   = document.querySelector('.statusbar');

function setStatus(msg) {
  statusEl.textContent = msg;
  if (statusBar) statusBar.textContent = msg;
}

// ── 上传 ──────────────────────────────────────────────────
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

// ── 参数控件 ────────────────────────────────────────────
document.getElementById('dynRange').addEventListener('input', function() {
  document.getElementById('dynRangeVal').textContent = this.value;
  scheduleRenderOnly();
});
document.getElementById('brightness').addEventListener('input', function() {
  document.getElementById('brightnessVal').textContent = parseFloat(this.value).toFixed(1);
  scheduleRenderOnly();
});
document.getElementById('gamma').addEventListener('input', function() {
  document.getElementById('gammaVal').textContent = parseFloat(this.value).toFixed(1);
  scheduleRenderOnly();
});
document.getElementById('colormap').addEventListener('change', () => scheduleRenderOnly());
document.getElementById('freqScale').addEventListener('change', () => scheduleRenderOnly());

document.getElementById('fftSize').addEventListener('change', () => scheduleRecompute());
document.getElementById('maxFreq').addEventListener('change', () => scheduleRecompute());

function scheduleRenderOnly() {
  if (!specData) return;
  clearTimeout(renderOnlyTimer);
  clearTimeout(recomputeTimer);
  renderOnlyTimer = setTimeout(() => {
    renderView();
    drawColorbar(currentCm());
  }, 50);
}

function scheduleRecompute() {
  if (!audioBuffer) return;
  clearTimeout(renderOnlyTimer);
  clearTimeout(recomputeTimer);
  recomputeTimer = setTimeout(() => generateSpectrogram(), 300);
}

function currentCm() {
  return colormaps[document.getElementById('colormap').value];
}

async function loadFile(file) {
  fileName = file.name;
  setStatus('正在解码音频...');
  saveBtn.disabled = true;
  audioEl.src = URL.createObjectURL(file);
  document.getElementById('audioPlayer').style.display = 'block';
  document.getElementById('infoName').textContent = file.name;
  document.getElementById('infoSize').textContent = (file.size/1024/1024).toFixed(2) + ' MB';
  const ab = await file.arrayBuffer();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  try {
    audioBuffer = await ac.decodeAudioData(ab);
    document.getElementById('infoDuration').textContent = audioBuffer.duration.toFixed(2) + ' 秒';
    document.getElementById('infoSR').textContent = audioBuffer.sampleRate + ' Hz';
    document.getElementById('infoCh').textContent = audioBuffer.numberOfChannels === 1 ? '单声道' : '立体声';
    document.getElementById('infoBar').style.display = 'flex';
    setStatus('解码完成，正在生成频谱图...');
    await generateSpectrogram();
  } catch(e) { setStatus('解码失败：' + e.message); }
}

// ── 生成频谱图（STFT 计算） ───────────────────────────────
async function generateSpectrogram() {
  if (!audioBuffer) return;
  renderingMask.classList.add('active');
  setStatus('正在计算频谱，请稍候...');
  await tick();

  const fftSize    = parseInt(document.getElementById('fftSize').value);
  const maxFreqSel = parseInt(document.getElementById('maxFreq').value);
  const rawData    = audioBuffer.getChannelData(0);
  const sr         = audioBuffer.sampleRate;
  const hop        = fftSize >> 2;
  const numFrames  = Math.floor((rawData.length - fftSize) / hop) + 1;
  const maxBin     = Math.round(maxFreqSel / (sr / fftSize));
  const useBins    = Math.min(maxBin, fftSize >> 1);

  const win = new Float32Array(fftSize);
  for (let i = 0; i < fftSize; i++)
    win[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / (fftSize - 1)));

  const data = new Float32Array(numFrames * useBins);
  let maxP = -Infinity;
  const CHUNK = 200;
  for (let fs = 0; fs < numFrames; fs += CHUNK) {
    const fe = Math.min(fs + CHUNK, numFrames);
    for (let f = fs; f < fe; f++) {
      const off = f * hop;
      const re = new Float32Array(fftSize), im = new Float32Array(fftSize);
      for (let i = 0; i < fftSize; i++)
        re[i] = (off + i < rawData.length ? rawData[off + i] : 0) * win[i];
      fft(re, im, fftSize);
      for (let b = 0; b < useBins; b++) {
        const p = 10 * Math.log10(re[b]*re[b] + im[b]*im[b] + 1e-10);
        data[f * useBins + b] = p;
        if (p > maxP) maxP = p;
      }
    }
    if (fs % (CHUNK * 4) === 0) {
      setStatus(`计算中 ${Math.round(fs/numFrames*100)}%...`);
      await tick();
    }
  }

  specData = data; specFrames = numFrames; specBins = useBins;
  specMaxPow = maxP; specSr = sr; specMaxFreq = maxFreqSel;
  specDuration = audioBuffer.duration; specFftSize = fftSize;

  viewZoom = 1; viewStart = 0;
  canvas.width  = Math.min(numFrames, 1600);
  canvas.height = useBins;

  renderView();
  viewer.style.display = 'flex';
  drawColorbar(currentCm());
  document.getElementById('colorbarWrap').style.display = 'flex';
  saveBtn.disabled = false;
  renderingMask.classList.remove('active');
  setStatus(`完成！${numFrames} 帧 · ${audioBuffer.duration.toFixed(2)}s · 调节参数实时更新`);
}

// ── 视图渲染 ──────────────────────────────────────────────
function renderView() {
  if (!specData) return;
  const W = canvas.width, H = canvas.height;
  const visFrames  = specFrames / viewZoom;
  const startF     = Math.max(0, viewStart);
  const dynRangeDB = parseInt(document.getElementById('dynRange').value);
  const dbFloor    = specMaxPow - dynRangeDB;
  const cm         = currentCm();
  const brightness = parseFloat(document.getElementById('brightness').value);
  const gamma      = parseFloat(document.getElementById('gamma').value);
  const freqScale  = document.getElementById('freqScale').value;

  const imgData = ctx.createImageData(W, H);

  for (let x = 0; x < W; x++) {
    const frame = Math.min(Math.floor(startF + x / W * visFrames), specFrames - 1);
    for (let py = 0; py < H; py++) {
      let b;
      if (freqScale === 'log') {
        const freqMin = 1;
        const freqMax = specMaxFreq;
        const logMin  = Math.log10(freqMin);
        const logMax  = Math.log10(freqMax);
        const frac   = (H - 1 - py) / (H - 1);
        const freq   = Math.pow(10, logMin + frac * (logMax - logMin));
        b = Math.round(freq / specMaxFreq * (specBins - 1));
      } else {
        b = H - 1 - py;
      }
      b = Math.max(0, Math.min(specBins - 1, b));

      const p = specData[frame * specBins + b];
      const rawT = Math.max(0, Math.min(1, (p - dbFloor) / (specMaxPow - dbFloor)));
      const t = applyColorTransform(rawT, brightness, gamma);
      const [r, g, bl] = cm(t);
      const i = (py * W + x) * 4;
      imgData.data[i] = r; imgData.data[i+1] = g; imgData.data[i+2] = bl; imgData.data[i+3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  drawAxisLabels(W, H, startF, visFrames, freqScale);
  updateScrollbar();
  updateZoomLabel();
}

function drawAxisLabels(W, H, startF, visFrames, freqScale) {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(W - 52, 0, 52, H);
  ctx.fillStyle = '#ccc'; ctx.font = '11px Arial'; ctx.textAlign = 'right';

  const freqTicks = [20,50,100,200,500,1000,2000,4000,6000,8000,10000,12000,16000,20000];
  freqTicks.filter(f => f <= specMaxFreq).forEach(f => {
    let y;
    if (freqScale === 'log') {
      const logMin = Math.log10(1);
      const logMax = Math.log10(specMaxFreq);
      const frac   = (Math.log10(Math.max(1, f)) - logMin) / (logMax - logMin);
      y = Math.round((H - 1) * (1 - frac));
    } else {
      y = H - 1 - Math.round(f / specMaxFreq * (specBins - 1));
    }
    if (y < 0 || y >= H) return;
    ctx.fillStyle = 'rgba(200,200,200,0.15)';
    ctx.fillRect(0, y, W - 54, 1);
    ctx.fillStyle = '#bbb';
    ctx.fillText(f >= 1000 ? (f/1000)+'k' : f+'', W - 4, y + 4);
  });

  const t0 = startF / specFrames * specDuration;
  const t1 = (startF + visFrames) / specFrames * specDuration;
  const span = t1 - t0;
  const step = niceStep(span / 8);
  ctx.fillStyle = '#aaa'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
    const x = Math.round((t - t0) / span * (W - 54));
    if (x < 0 || x > W - 54) continue;
    ctx.fillStyle = 'rgba(200,200,200,0.15)';
    ctx.fillRect(x, 0, 1, H);
    ctx.fillStyle = '#aaa';
    ctx.fillText(t.toFixed(span < 2 ? 2 : 1) + 's', x, H - 4);
  }

  timeRange.textContent = `${t0.toFixed(2)}s — ${t1.toFixed(2)}s`;
}

function niceStep(approx) {
  const e = Math.pow(10, Math.floor(Math.log10(approx)));
  for (const m of [1, 2, 5, 10]) if (m * e >= approx) return m * e;
  return e * 10;
}

// ── 滚动条 ────────────────────────────────────────────────
function updateScrollbar() {
  const trackW = scrollTrack.clientWidth;
  const ratio  = 1 / viewZoom;
  const thumbW = Math.max(16, trackW * ratio);
  const maxLeft = trackW - thumbW;
  const maxStart = specFrames - specFrames / viewZoom;
  const thumbL = maxStart > 0 ? (viewStart / maxStart) * maxLeft : 0;
  scrollThumb.style.width = thumbW + 'px';
  scrollThumb.style.left  = thumbL + 'px';
}

function updateZoomLabel() {
  zoomLabel.textContent = viewZoom >= 1 ? viewZoom + '×' : (1/viewZoom).toFixed(1) + '×';
}

let thumbDrag = false, thumbDragX = 0, thumbDragStart = 0;
scrollThumb.addEventListener('mousedown', e => {
  thumbDrag = true; thumbDragX = e.clientX; thumbDragStart = viewStart;
  scrollThumb.classList.add('dragging'); e.stopPropagation(); e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!thumbDrag) return;
  const trackW  = scrollTrack.clientWidth;
  const thumbW  = parseFloat(scrollThumb.style.width);
  const maxLeft = trackW - thumbW;
  const dx = e.clientX - thumbDragX;
  const maxStart = specFrames - specFrames / viewZoom;
  viewStart = Math.max(0, Math.min(maxStart, thumbDragStart + dx / maxLeft * maxStart));
  renderView();
});
window.addEventListener('mouseup', () => {
  if (thumbDrag) { thumbDrag = false; scrollThumb.classList.remove('dragging'); }
  if (canvasDrag) { canvasDrag = false; canvas.style.cursor = 'crosshair'; }
});

scrollTrack.addEventListener('click', e => {
  if (e.target === scrollThumb) return;
  const rect = scrollTrack.getBoundingClientRect();
  const frac = (e.clientX - rect.left) / rect.width;
  const maxStart = specFrames - specFrames / viewZoom;
  viewStart = Math.max(0, Math.min(maxStart, frac * specFrames - (specFrames / viewZoom) / 2));
  renderView();
});

// ── 鼠标滚轮缩放 ──────────────────────────────────────────
canvas.addEventListener('wheel', e => {
  if (!specData) return;
  e.preventDefault();
  const rect  = canvas.getBoundingClientRect();
  const fracX = (e.clientX - rect.left) / rect.width;
  const visFrames = specFrames / viewZoom;
  const frameUnder = viewStart + fracX * visFrames;

  const factor  = e.deltaY < 0 ? 2 : 0.5;
  const newZoom = Math.max(1, Math.min(64, viewZoom * factor));
  const newVis  = specFrames / newZoom;
  let newStart  = frameUnder - fracX * newVis;
  newStart = Math.max(0, Math.min(specFrames - newVis, newStart));

  viewZoom = newZoom; viewStart = newStart;
  renderView();
}, { passive: false });

// ── 拖动平移 ──────────────────────────────────────────────
let canvasDrag = false, dragX = 0, dragViewStart = 0;
canvas.addEventListener('mousedown', e => {
  if (!specData) return;
  canvasDrag = true; dragX = e.clientX; dragViewStart = viewStart;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!canvasDrag) return;
  const rect = canvas.getBoundingClientRect();
  const dx = e.clientX - dragX;
  const visFrames  = specFrames / viewZoom;
  const framesPerPx = visFrames / rect.width;
  const maxStart   = specFrames - visFrames;
  viewStart = Math.max(0, Math.min(maxStart, dragViewStart - dx * framesPerPx));
  renderView();
});

// ── 缩放按钮 ──────────────────────────────────────────────
document.getElementById('zoomIn').addEventListener('click', () => changeZoom(2, 0.5));
document.getElementById('zoomOut').addEventListener('click', () => changeZoom(0.5, 0.5));
document.getElementById('zoomReset').addEventListener('click', () => {
  viewZoom = 1; viewStart = 0; renderView();
});
function changeZoom(factor, anchor) {
  if (!specData) return;
  const visFrames  = specFrames / viewZoom;
  const frameAnchor = viewStart + anchor * visFrames;
  const newZoom = Math.max(1, Math.min(64, viewZoom * factor));
  const newVis  = specFrames / newZoom;
  let newStart  = frameAnchor - anchor * newVis;
  newStart = Math.max(0, Math.min(specFrames - newVis, newStart));
  viewZoom = newZoom; viewStart = newStart;
  renderView();
}

// ── 保存当前视图 ──────────────────────────────────────────
saveBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  const base = fileName.replace(/\.[^.]+$/, '');
  link.download = `${base}_spectrogram_${viewZoom}x.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// ── 色标 ──────────────────────────────────────────────────
function drawColorbar(cm) {
  colorbarCv.width = 400; colorbarCv.height = 16;
  const cc = colorbarCv.getContext('2d');
  const img = cc.createImageData(400, 16);
  const brightness = parseFloat(document.getElementById('brightness').value);
  const gamma      = parseFloat(document.getElementById('gamma').value);
  for (let x = 0; x < 400; x++) {
    const t = applyColorTransform(x/399, brightness, gamma);
    const [r,g,b] = cm(t);
    for (let y = 0; y < 16; y++) {
      const i = (y*400+x)*4;
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }
  }
  cc.putImageData(img, 0, 0);
}

// ── FFT（Cooley-Tukey）────────────────────────────────────
function fft(re, im, n) {
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]];
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wR = Math.cos(ang), wI = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cR = 1, cI = 0;
      for (let j = 0; j < len >> 1; j++) {
        const uR = re[i+j], uI = im[i+j];
        const vR = re[i+j+(len>>1)]*cR - im[i+j+(len>>1)]*cI;
        const vI = re[i+j+(len>>1)]*cI + im[i+j+(len>>1)]*cR;
        re[i+j]=uR+vR; im[i+j]=uI+vI;
        re[i+j+(len>>1)]=uR-vR; im[i+j+(len>>1)]=uI-vI;
        const nR=cR*wR-cI*wI; cI=cR*wI+cI*wR; cR=nR;
      }
    }
  }
}

function tick() { return new Promise(r => setTimeout(r, 0)); }
</script>
